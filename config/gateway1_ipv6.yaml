# Gateway Configuration - Dual-stack IPv6/IPv4 (example)
# Binds on :: with IPV6_V6ONLY=0 so IPv4-mapped clients can connect on the same port.

gateway:
  name: "Gateway1"
  description: "Primary DoIP Gateway (dual-stack)"
  logical_address: 0x1000

  vehicle:
    vin: "1HGBH41JXMN109186"
    eid: "123456789ABC"
    gid: "DEF012345678"

  network:
    host: "::"
    dual_stack: true
    port: 13400
    max_connections: 10
    timeout: 60
    keep_alive: true
    tcp_nodelay: true

  protocol:
    version: 0x02
    inverse_version: 0xFD

  settings:
    enable_logging: true
    log_level: "INFO"
    enable_security: false
    allow_multiple_sessions: true

  ecus:
    - "ecus/engine/ecu_engine.yaml"
    - "ecus/transmission/ecu_transmission.yaml"
    - "ecus/abs/ecu_abs.yaml"
    - "ecus/esp/ecu_esp.yaml"
    - "ecus/steering/ecu_steering.yaml"
    - "ecus/bcm/ecu_bcm.yaml"
    - "ecus/gateway/ecu_gateway.yaml"
    - "ecus/hvac/ecu_hvac.yaml"

  response_codes:
    routine_activation:
      0x10: "Routine started successfully"
      0x22: "Conditions not correct"
      0x31: "Incorrect routine identifier"
      0x33: "Security access denied"
    uds:
      0x10: "General reject"
      0x12: "Sub-function not supported"
      0x13: "Incorrect message length or invalid format"
      0x22: "Conditions not correct"
      0x24: "Request sequence error"
      0x31: "Request out of range"
      0x33: "Security access denied"
      0x35: "Invalid key"
      0x36: "Exceeded number of attempts"
      0x37: "Required time delay not expired"
      0x70: "Upload download not accepted"
      0x71: "Transfer data suspended"
      0x72: "General programming failure"
      0x73: "Wrong block sequence counter"
      0x78: "Request correctly received - response pending"
      0x7E: "Sub-function not supported in active session"
      0x7F: "Service not supported in active session"

  power_mode_status:
    description: "Power mode status values for DoIP power mode response (payload type 0x4004)"
    current_status: 0x01
    available_statuses:
      0x00:
        name: "Power Off"
        description: "ECU is powered off"
      0x01:
        name: "Power On"
        description: "ECU is powered on and ready"
      0x02:
        name: "Power Standby"
        description: "ECU is in standby mode"
      0x03:
        name: "Power Sleep"
        description: "ECU is in sleep mode"
      0x04:
        name: "Power Wake"
        description: "ECU is waking up"
    response_cycling:
      enabled: false
      cycle_through: [0x01, 0x02, 0x03]

  entity_status:
    description: "DoIP Entity Status Response configuration (payload type 0x4002)"
    node_type: 0x01
    max_open_sockets: 10
    current_open_sockets: 0
    doip_entity_status: 0x00
    diagnostic_power_mode: 0x02
    available_node_types:
      0x01:
        name: "Vehicle Gateway"
        description: "DoIP entity is a vehicle gateway"
      0x02:
        name: "Node"
        description: "DoIP entity is a node"
    available_entity_statuses:
      0x00:
        name: "Ready"
        description: "Entity is ready for diagnostic communication"
      0x01:
        name: "Not Ready"
        description: "Entity is not ready for diagnostic communication"
    available_diagnostic_power_modes:
      0x01:
        name: "Power On"
        description: "Diagnostic power is on"
      0x02:
        name: "Power Off"
        description: "Diagnostic power is off"
      0x03:
        name: "Not Ready"
        description: "Diagnostic power is not ready"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "doip_server.log"
  console: true
  max_file_size: "10MB"
  backup_count: 5

security:
  enabled: false
  allowed_sources_strict: false
  require_auth_for:
    - "routine_activation"
    - "uds_write_operations"
