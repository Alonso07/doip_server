{% extends "base.html" %}
{% block title %}Services – DoIP Server{% endblock %}

{% block content %}
<div class="flex items-center gap-3 mb-6">
  <a href="/ecus" class="text-gray-500 hover:text-gray-300">← ECUs</a>
  <h1 class="text-xl font-bold text-amber-400">
    UDS Services – ECU 0x{{ '%04X' | format(ecu_address) }}
  </h1>
</div>

<!-- Add Service form -->
<section class="mb-8" x-data="{ open: false }">
  <button @click="open = !open"
          class="text-xs px-3 py-1 bg-green-700 hover:bg-green-600 rounded mb-3">
    + Add Service
  </button>

  <form x-show="open" x-cloak
        hx-post="/api/ecus/{{ ecu_address }}/services?service_name=new_service"
        hx-target="#service-table"
        hx-swap="outerHTML"
        @htmx:after-request="open = false"
        class="bg-gray-800 border border-gray-700 rounded p-4 grid grid-cols-2 gap-3 mb-4">
    <label class="flex flex-col gap-1 text-xs">
      Service Name
      <input name="service_name" type="text" required
             class="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white"/>
    </label>
    <label class="flex flex-col gap-1 text-xs">
      Request (hex, e.g. 0x22F190)
      <input name="request" type="text" required
             class="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white"/>
    </label>
    <label class="flex flex-col gap-1 text-xs col-span-2">
      Response (hex, e.g. 0x62F190…)
      <input name="response" type="text"
             class="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white"/>
    </label>
    <label class="flex items-center gap-2 text-xs col-span-2">
      <input type="checkbox" name="supports_functional" class="rounded"/>
      Supports functional addressing
    </label>
    <div class="col-span-2 flex gap-2">
      <button type="submit"
              class="px-3 py-1 bg-green-700 hover:bg-green-600 rounded text-xs">Save</button>
      <button type="button" @click="open = false"
              class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs">Cancel</button>
    </div>
  </form>
</section>

<!-- Service table -->
<div id="service-table"
     hx-get="/api/ecus/{{ ecu_address }}/services"
     hx-trigger="load"
     hx-swap="outerHTML"
     class="overflow-x-auto">
  Loading…
</div>
{% endblock %}
