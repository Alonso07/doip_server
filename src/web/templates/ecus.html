{% extends "base.html" %}
{% block title %}ECUs – DoIP Server{% endblock %}

{% block content %}
<h1 class="text-xl font-bold text-amber-400 mb-6">ECU Management</h1>

<!-- Add ECU -->
<section class="mb-6">
  <button onclick="newEcu()"
          class="text-xs px-3 py-1 bg-green-700 hover:bg-green-600 rounded">
    + Add ECU
  </button>
</section>

<!-- ECU table -->
<div id="ecu-table"
     hx-get="/api/ecus"
     hx-trigger="load"
     hx-swap="outerHTML"
     class="overflow-x-auto">
  Loading…
</div>
{% endblock %}
