<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}DoIP Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.2"></script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
  <style>
    [x-cloak] { display: none !important; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
  </style>
</head>
<body class="h-full text-gray-100 font-mono text-sm">

  <!-- Sidebar -->
  <div class="flex h-full">
    <nav class="w-52 shrink-0 bg-gray-900 border-r border-gray-700 flex flex-col p-4 gap-2">
      <div class="text-amber-400 font-bold text-base mb-4">⚡ DoIP Dashboard</div>

      <a href="/"
         class="px-3 py-2 rounded hover:bg-gray-800 {% if request.url.path == '/' %}bg-gray-800 text-amber-400{% endif %}">
        Dashboard
      </a>
      <a href="/ecus"
         class="px-3 py-2 rounded hover:bg-gray-800 {% if '/ecus' in request.url.path %}bg-gray-800 text-amber-400{% endif %}">
        ECUs
      </a>
      <a href="/client"
         class="px-3 py-2 rounded hover:bg-gray-800 {% if request.url.path == '/client' %}bg-gray-800 text-amber-400{% endif %}">
        DoIP Client
      </a>

      <!-- Persistence mode toggle -->
      <div class="mt-auto border-t border-gray-700 pt-3">
        <label class="flex items-center gap-2 cursor-pointer text-xs">
          <input id="persist-toggle" type="checkbox" class="rounded"/>
          <span class="text-gray-300">Save changes to files</span>
        </label>
        <div id="persist-hint" class="text-[10px] text-gray-600 mt-1">Session only (temporary)</div>
      </div>

      <!-- Server status badge -->
      <div class="mt-3">
        <div id="status-badge"
             hx-get="/api/status"
             hx-trigger="load, every 5s"
             hx-swap="outerHTML">
          <span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-gray-700 text-xs text-gray-400">
            <span class="w-2 h-2 rounded-full bg-gray-500"></span> checking…
          </span>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 overflow-auto p-6">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Edit modal -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-lg w-full max-w-lg max-h-[90vh] overflow-auto">
      <div class="flex items-center justify-between px-5 py-3 border-b border-gray-700">
        <h3 id="modal-title" class="font-bold text-amber-400"></h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-300 text-lg leading-none">&times;</button>
      </div>
      <div id="modal-body" class="p-5"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
